name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]
        pocketbase-version: ['v0.39.11', 'v0.40.3']
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (tsc)
        run: npm run build

      - name: Typecheck (src + tests)
        run: npm run typecheck

      # Hermetic suite (unit + contract): runs BEFORE any PocketBase binary is
      # downloaded; no network dependency. Contract layer includes the MCP
      # tools/list snapshot (back-compat lock) and a real stdio spawn of
      # build/index.js.
      - name: Unit + contract tests (vitest, hermetic)
        run: npm test

      - name: Download PocketBase ${{ matrix.pocketbase-version }}
        run: |
          VER="${{ matrix.pocketbase-version }}"
          curl -fsSL -o pb.zip "https://github.com/pocketbase/pocketbase/releases/download/${VER}/pocketbase_${VER#v}_linux_amd64.zip"
          unzip pb.zip -d /tmp/pb-bin
          chmod +x /tmp/pb-bin/pocketbase
          /tmp/pb-bin/pocketbase --version

      # Full vitest integration layer against the REAL binary: ephemeral
      # server instance (OS-assigned port, unique superuser identity,
      # isolated --migrationsDir) + generated migrations validated with the
      # official `migrate up/down` runner.
      - name: Integration tests (vitest) against PocketBase ${{ matrix.pocketbase-version }}
        run: POCKETBASE_BIN=/tmp/pb-bin/pocketbase npm run test:integration

      # End-to-end MCP smoke (scripts/smoke.mjs): drives the built server over
      # stdio against a real PocketBase instance (37 checks).
      - name: Integration smoke (scripts/smoke.mjs) against PocketBase ${{ matrix.pocketbase-version }}
        run: POCKETBASE_BIN=/tmp/pb-bin/pocketbase npm run smoke
