name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]
        pocketbase-version: ['v0.39.11', 'v0.40.3']
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (tsc)
        run: npm run build

      - name: Contract smoke (tools/list over stdio, no PocketBase needed)
        run: npm test

      - name: Download PocketBase ${{ matrix.pocketbase-version }}
        run: |
          curl -sL -o pb.zip "https://github.com/pocketbase/pocketbase/releases/download/${{ matrix.pocketbase-version }}/pocketbase_${{ matrix.pocketbase-version }}_linux_amd64.zip"
          unzip pb.zip -d /tmp/pb-bin
          chmod +x /tmp/pb-bin/pocketbase
          /tmp/pb-bin/pocketbase --version

      - name: Integration smoke against PocketBase ${{ matrix.pocketbase-version }}
        run: POCKETBASE_BIN=/tmp/pb-bin/pocketbase npm run test:integration
